name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

jobs:
  nuget:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test Conq.Noble.Spreadox.sln -c Release --filter Category!=Perf

      - name: Pack
        run: dotnet pack src/Conq.Noble.Spreadox/Conq.Noble.Spreadox.csproj -c Release -o artifacts

      - name: List Artifacts
        run: Get-ChildItem artifacts

      - name: NuGet Login (OIDC Trusted Publishing)
        id: login
        uses: NuGet/login@v1
        with:
          user: fatihbaycu

      - name: Push nuget.org
        run: |
          Get-ChildItem -Path "artifacts" -Filter "*.nupkg" | ForEach-Object {
            Write-Host "Publishing $($_.FullName)..."
            dotnet nuget push $_.FullName --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          }
